name: CivicPulse AI CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Verify Configuration Anti-Drift
        run: node tests/config-drift.test.mjs

      - name: Run Security & RLS Policy Tests
        run: node tests/test-security.mjs

      - name: Run Core Logic Test Suite
        run: node tests/runner.mjs

      - name: Run Duplicate Detection Benchmark (30 Pairs)
        run: node eval/run-eval.mjs

      - name: Run 14-Step End-to-End Lifecycle Journey
        run: node tests/test-e2e-journey.mjs

      - name: Build Web Application
        run: npm run build
